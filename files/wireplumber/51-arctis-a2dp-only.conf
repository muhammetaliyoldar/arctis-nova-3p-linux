# WirePlumber 0.5+ için (0.4 kullananlar .lua dosyasını kullanır)
# Arctis Nova 3P, PipeWire'ın sunduğu LDAC/aptX/FastStream/Opus endpoint'lerini
# sorgularken donup kendini kapatıyor. Sadece SBC ve sadece A2DP bırakılır.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.hfphsp-backend = "none"
  bluez5.codecs = [ sbc ]
}
